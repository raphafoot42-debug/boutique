<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkidea</title>
<meta name="description" content="Sparkidea — communaute et formation dediee a l'affiliation casino.">
<meta property="og:title" content="Sparkidea">
<meta property="og:description" content="Communaute et formation dediee a l'affiliation casino. Entraide, strategies et ressources.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230E0E11'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,sans-serif' font-weight='800' fill='%23D4AF37' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E11; --bg-elev:#18181C; --bg-elev2:#1F1F24; --bg-hover:#26262C;
  --gold:#D4AF37; --gold-dim:#8C7A2E; --gold-bg:rgba(212,175,55,0.12);
  --text:#F1F0EA; --text-sec:#98979E; --border:#2A2A30; --danger:#C0503F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;}
.ff-display{font-family:'Manrope',sans-serif;}
.ff-mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
input,textarea,select{font-family:'Inter',sans-serif;background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px;}
button{cursor:pointer;font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#2E2E33;border-radius:4px;}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: #0A0A0C;
  border-bottom: 1px solid var(--border);
  height: 54px;
  flex-shrink: 0;
}
.logo-box {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--gold-bg);
  border: 1px solid var(--gold-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  font-weight: 800;
  font-size: 16px;
}
.brand-title {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--text);
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-sec);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.nav-btn:hover {
  background: var(--bg-hover);
  color: var(--text);
}
.nav-btn.active {
  background: var(--gold-bg);
  color: var(--gold);
  border-color: var(--gold-dim);
}
.menu-btn {
  display: none;
  background: none;
  border: none;
  color: var(--text-sec);
  font-size: 18px;
  cursor: pointer;
}

.full{width:100%;}
.field-label{font-size:11px;color:var(--text-sec);text-transform:uppercase;letter-spacing:0.6px;}
.btn-gold{background:var(--gold);color:#1A1305;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;transition:filter .15s ease;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
.btn-outline:hover{border-color:var(--gold-dim);background:var(--gold-bg);}

.avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-elev2);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:12px;flex-shrink:0;}
.member-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;}
.status-dot.online{background:#3ECF6E;}
.status-dot.offline{background:var(--text-sec);}

.auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-sec); border-bottom: 2px solid transparent; }
.auth-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.sidebar{width:220px;background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-head{padding:16px 14px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);text-transform:uppercase;color:var(--text-sec);letter-spacing:0.5px;}
.cat-title{padding:6px 8px;color:var(--text-sec);font-size:11px;font-weight:700;text-transform:uppercase;}
.chan{display:flex;align-items:center;padding:7px 10px;margin:2px 0;border-radius:6px;cursor:pointer;color:var(--text-sec);font-size:13px;transition:all .12s ease;}
.chan:hover{background:var(--bg-hover);color:var(--text);}
.chan.active{background:var(--gold-bg);color:var(--gold);font-weight:600;}

.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
.chat-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg-elev);display:flex;align-items:center;justify-content:space-between;}
.messages-list{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.message-row{display:flex;gap:12px;align-items:flex-start;}
.chat-input-box{padding:16px 20px;border-top:1px solid var(--border);background:var(--bg-elev);}

.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:100;}
@media (max-width: 768px) {
  .menu-btn { display: block; }
  .sidebar { display: none; position: absolute; top: 54px; bottom: 0; z-index: 50; }
  .sidebar.open { display: flex; }
}
</style>
</head>
<body>

<div id="login" style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">
  <div class="card" style="width:100%; max-width:400px; background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; padding:28px;">
    <div class="logo-box" style="margin:0 auto 16px auto; width:48px; height:48px; font-size:24px;">S</div>
    <h1 class="ff-display" id="loginTitle" style="font-size:24px; font-weight:800; margin:0 0 6px; text-align:center;">Sparkidea</h1>
    <p style="color:var(--text-sec); font-size:13px; margin:0 0 20px; text-align:center;">Communaute et formation affiliation casino.</p>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLoginBtn" onclick="setAuthMode('login')">Se connecter</div>
      <div class="auth-tab" id="tabRegisterBtn" onclick="setAuthMode('register')">S'inscrire</div>
    </div>

    <form id="authLoginForm" onsubmit="handleAuthLogin(event)">
      <div class="field-label" style="margin-bottom:4px;">Email</div>
      <input class="full" id="loginEmail" type="email" placeholder="vous@exemple.fr" required style="margin-bottom:14px; width:100%;">
      <div class="field-label" style="margin-bottom:4px;">Mot de passe</div>
      <input class="full" id="loginPassword" type="password" placeholder="••••••••" required style="margin-bottom:20px; width:100%;">
      <button class="btn-gold full" type="submit" style="width:100%;">Connexion</button>
    </form>

    <form id="authRegisterForm" onsubmit="handleAuthRegister(event)" style="display:none;">
      <div class="field-label" style="margin-bottom:4px;">Nom / Pseudo</div>
      <input class="full" id="regName" placeholder="Votre pseudo" required style="margin-bottom:14px; width:100%;">
      <div class="field-label" style="margin-bottom:4px;">Email</div>
      <input class="full" id="regEmail" type="email" placeholder="vous@exemple.fr" required style="margin-bottom:14px; width:100%;">
      <div class="field-label" style="margin-bottom:4px;">Mot de passe</div>
      <input class="full" id="regPassword" type="password" placeholder="••••••••" required style="margin-bottom:16px; width:100%;">
      <label style="display:flex; align-items:flex-start; gap:8px; margin-bottom:20px; font-size:11.5px; color:var(--text-sec); cursor:pointer;">
        <input type="checkbox" id="regMajeur" required style="margin-top:2px; flex-shrink:0;">
        <span>Je certifie etre majeur(e) et j'accepte les CGU et la politique de confidentialite.</span>
      </label>
      <button class="btn-gold full" type="submit" style="width:100%;">Rejoindre Sparkidea</button>
      <p style="font-size:11px; color:var(--text-sec); margin-top:12px; text-align:center;">Le premier inscrit devient administrateur principal.</p>
    </form>

    <p id="authError" style="font-size:12px; color:var(--danger); margin-top:14px; text-align:center; display:none;"></p>
  </div>
</div>

<div id="app" style="display:none;"></div>

<div id="adminOverlay" class="modal-back" style="display:none;">
  <div id="adminPanel"></div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
